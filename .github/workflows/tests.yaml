name: Tests
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - LICENSE
      - README.md
      - MIGRATION.md
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check build, vet, formatting and modules
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
          cache-dependency-path: "**/go.sum"
      - name: Run checks
        run: make check

  test:
    name: ${{ matrix.module }} (Go ${{ matrix.setup.go-version }}, ${{ matrix.setup.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "chi-v5", "echo-v4", "echo-v5", "fiber-v2", "fiber-v3", "gin-v1"]
        setup:
          - go-version: "1.25"
            dependencies: floor
          - go-version: "1.26"
            dependencies: latest
          - go-version: "1.27"
            dependencies: latest
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.setup.go-version }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Upgrade all dependencies to their latest releases
        if: matrix.setup.dependencies == 'latest'
        run: |
          go get -u -t ./...
          go mod tidy
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.module }}/coverage.txt

  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - check
      - test
    if: always()
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  pi-fix-ci:
    needs: ci-gate
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.ci-gate.result == 'failure' &&
      github.run_attempt == 1 &&
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Pi Fix CI workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pi-fix-ci.yaml --ref main -f run_id="$GITHUB_RUN_ID"
